name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile GPay Companion APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-gpay-companion

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ClayGPayCompanion.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClayGPayCompanion-APK
          path: android-gpay-companion/output/ClayGPayCompanion.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Clay GPay Companion APK v1.0.0"
          body: "Direct download of Clay Chat Google Pay for Business Webhook Companion Android APK."
          files: android-gpay-companion/output/ClayGPayCompanion.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
